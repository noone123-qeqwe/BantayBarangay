<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BantayBarangay — Barangay Operations Command Center Login</title>
  <meta name="description" content="Authorized administrative portal for Masbate Province Barangay staff, responders, and agency liaisons to triage reports and coordinate operations." />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/common.css?v=5.6" />

  <style>
    /* ── RESIDENT-IDENTICAL LIGHT CIVIC DESIGN SYSTEM ─────── */
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #f0f9ff;
      --primary-border: #bae6fd;
      --text-dark: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --border-subtle: #e2e8f0;
      --border-input: #cbd5e1;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body.admin-login-body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px 16px 40px;
      width: 100%;
      background-color: #f1f5f9;
      background-image: radial-gradient(circle at 50% 12%, #e0f2fe 0%, #f1f5f9 55%, #e2e8f0 100%);
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── AMBIENT BACKGROUND LAYER ────────────────────────── */
    .auth-bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .auth-bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 20s linear infinite;
    }

    @keyframes gridDrift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    .auth-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform, opacity;
    }

    .auth-orb-1 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.22) 0%, transparent 70%);
      top: -180px;
      left: -140px;
      animation: orbDrift1 18s ease-in-out infinite;
    }

    .auth-orb-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(6, 78, 119, 0.28) 0%, transparent 70%);
      bottom: -120px;
      right: -100px;
      animation: orbDrift2 22s ease-in-out infinite;
    }

    @keyframes orbDrift1 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(40px, 50px) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes orbDrift2 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-40px, -30px) scale(1.08); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .auth-particles {
      position: absolute;
      inset: 0;
    }

    .auth-particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: var(--s);
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(56, 189, 248, 0.5);
      animation: particleFloat var(--d) ease-in-out infinite alternate;
      opacity: 0.65;
    }

    @keyframes particleFloat {
      0%   { transform: translateY(0px) scale(1); opacity: 0.3; }
      100% { transform: translateY(-24px) scale(1.2); opacity: 0.8; }
    }

    /* ── MAIN GLASS CONTAINER (IDENTICAL TO RESIDENT) ───── */
    .admin-login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .admin-login-panel {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 26px;
      box-shadow:
        0 20px 60px -15px rgba(0, 0, 0, 0.08),
        0 2px 10px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      position: relative;
    }

    /* Top Accent Line */
    .admin-login-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #0ea5e9);
    }

    /* ── BRAND HEADER (IDENTICAL TO RESIDENT) ─────────────── */
    .admin-card-header {
      padding: 34px 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: linear-gradient(180deg, rgba(2, 132, 199, 0.06) 0%, transparent 100%);
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .auth-brand-aura {
      position: absolute;
      top: -30px;
      width: 200px;
      height: 90px;
      background: radial-gradient(ellipse at center, rgba(2, 132, 199, 0.2) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(20px);
    }

    .logo-icon-wrap-premium {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8, #0ea5e9);
      opacity: 0.7;
      filter: blur(5px);
      animation: auraPulse 3s ease-in-out infinite alternate;
    }

    @keyframes auraPulse {
      0%   { transform: scale(0.96); opacity: 0.55; }
      100% { transform: scale(1.06); opacity: 0.85; }
    }

    .brand-logo-img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 50%;
      position: relative;
      z-index: 1;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .logo-text {
      margin-top: 10px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .logo-main {
      color: var(--text-dark);
    }

    .logo-accent {
      color: var(--primary);
    }

    .auth-civic-subtitle-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .auth-republic-text {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .auth-bullet {
      color: #94a3b8;
      font-size: 10.5px;
    }

    .auth-province-text {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .admin-portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    /* ── CARD BODY ───────────────────────────────────────── */
    .admin-card-body {
      padding: 26px 28px 28px;
    }

    /* Segmented Tab Switcher */
    .auth-segment-control {
      display: flex;
      background: #f1f5f9;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
    }

    .auth-segment-tab {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .auth-segment-tab:hover {
      color: var(--text-dark);
    }

    .auth-segment-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    /* Error Banner */
    .admin-error-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: left;
    }

    .admin-error-box.hidden {
      display: none;
    }

    /* Demo Helper Box */
    .admin-demo-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 12px;
      color: #0369a1;
    }

    .admin-demo-btn {
      background: var(--primary);
      border: none;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .admin-demo-btn:hover {
      background: var(--primary-hover);
    }

    /* Form Fields */
    .admin-field-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .admin-field-label {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-body);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .admin-input-wrap {
      position: relative;
    }

    .admin-light-input {
      width: 100%;
      box-sizing: border-box;
      background: #ffffff;
      border: 1.5px solid var(--border-input);
      border-radius: 12px;
      color: var(--text-dark);
      padding: 11px 14px;
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .admin-light-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3.5px rgba(2, 132, 199, 0.15);
    }

    .admin-light-input::placeholder {
      color: #94a3b8;
    }

    .admin-pass-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s ease;
    }

    .admin-pass-toggle:hover {
      color: var(--text-dark);
    }

    /* PIN Box */
    .admin-pin-large-input {
      text-align: center;
      font-size: 26px;
      letter-spacing: 12px;
      font-weight: 800;
      padding: 11px 14px;
      color: var(--primary) !important;
    }

    /* Submit Button (Identical to Resident) */
    .btn-admin-submit {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.28);
      margin-top: 6px;
    }

    .btn-admin-submit:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.38);
    }

    .btn-admin-submit:active {
      transform: translateY(0);
    }

    /* Footer Navigation Links */
    .admin-footer-links {
      margin-top: 24px;
      text-align: center;
      border-top: 1px solid var(--border-subtle);
      padding-top: 18px;
    }

    .admin-back-resident {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }

    .admin-back-resident:hover {
      color: var(--primary);
    }

    .admin-form-version {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 11.5px;
      color: #94a3b8;
    }

    .admin-version-badge {
      font-size: 11px;
      font-weight: 700;
      background: #f1f5f9;
      color: #64748b;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="admin-login-body">

  <!-- ── BACKGROUND ANIMATION LAYER (IDENTICAL TO RESIDENT) ── -->
  <div class="auth-bg-layer" aria-hidden="true">
    <div class="auth-bg-grid"></div>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-particles">
      <span class="auth-particle" style="--x:8%;--y:20%;--d:5s;--s:3px"></span>
      <span class="auth-particle" style="--x:18%;--y:65%;--d:7s;--s:2px"></span>
      <span class="auth-particle" style="--x:30%;--y:40%;--d:6s;--s:4px"></span>
      <span class="auth-particle" style="--x:55%;--y:15%;--d:5.5s;--s:3px"></span>
      <span class="auth-particle" style="--x:75%;--y:30%;--d:6.5s;--s:4px"></span>
      <span class="auth-particle" style="--x:88%;--y:70%;--d:7.5s;--s:3px"></span>
    </div>
  </div>

  <div class="admin-login-container">
    <div class="admin-login-panel">

      <!-- ════ BRAND HEADER ═════════════════════════════════ -->
      <div class="admin-card-header">
        <div class="auth-brand-aura"></div>
        <div class="logo-icon-wrap-premium">
          <div class="logo-glow-ring"></div>
          <img src="images/logo.png" alt="BantayBarangay Seal" class="brand-logo-img" />
        </div>
        <div class="logo-text">
          <span class="logo-main">Bantay</span><span class="logo-accent">Barangay</span>
        </div>
        <div class="auth-civic-subtitle-bar">
          <span class="auth-republic-text">Republic of the Philippines</span>
          <span class="auth-bullet">•</span>
          <span class="auth-province-text">Province of Masbate</span>
        </div>
        <div class="admin-portal-badge">
          <span>🛡️ Barangay Operations Command</span>
        </div>
      </div>

      <!-- ════ FORM BODY ═════════════════════════════════════ -->
      <div class="admin-card-body">

        <!-- TAB SWITCHER: CREDENTIALS vs PIN -->
        <div class="auth-segment-control" role="tablist" aria-label="Admin Login Method">
          <button type="button" class="auth-segment-tab active" id="tabCreds" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Officer Credentials</span>
          </button>
          <button type="button" class="auth-segment-tab" id="tabPin" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
              <line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>
            <span>Security PIN</span>
          </button>
        </div>

        <!-- ERROR BANNER -->
        <div class="admin-error-box hidden" id="adminErrorBanner" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="flex-shrink:0;">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="adminErrorMessage">Authentication error.</span>
        </div>

        <!-- VIEW A: CREDENTIALS (GMAIL + PASSWORD) -->
        <form id="adminCredsForm" novalidate>
          <div class="admin-demo-box">
            <span>⚡ Demo Officer: <strong>admin@gmail.com</strong></span>
            <button type="button" class="admin-demo-btn" id="btnFillDemoCreds">Auto-Fill</button>
          </div>

          <div class="admin-field-group">
            <label class="admin-field-label" for="adminEmailInput">
              <span>Officer Gmail Address</span>
              <span style="color:#ef4444">*</span>
            </label>
            <div class="admin-input-wrap">
              <input type="email" id="adminEmailInput" class="admin-light-input" placeholder="admin@gmail.com" autocomplete="email" autofocus required />
            </div>
          </div>

          <div class="admin-field-group">
            <label class="admin-field-label" for="adminPassInput">
              <span>Password</span>
              <span style="color:#ef4444">*</span>
            </label>
            <div class="admin-input-wrap">
              <input type="password" id="adminPassInput" class="admin-light-input" placeholder="Enter password" autocomplete="current-password" required />
              <button type="button" class="admin-pass-toggle" id="btnToggleAdminPass" title="Toggle visibility">
                <svg id="adminPassEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-admin-submit" id="btnAdminLoginSubmit">
            <span>Access Command Center</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </form>

        <!-- VIEW B: 4-DIGIT SECURITY PIN -->
        <form id="adminPinViewForm" class="hidden" novalidate>
          <div class="admin-demo-box">
            <span>⚡ Demo Officer PIN: <strong style="color:var(--primary)">1234</strong></span>
            <button type="button" class="admin-demo-btn" id="btnFillDemoPin">Auto-Fill</button>
          </div>

          <div class="admin-field-group">
            <label class="admin-field-label" for="adminPinInput">
              <span>4-Digit Officer Security PIN</span>
              <span style="color:#ef4444">*</span>
            </label>
            <div class="admin-input-wrap">
              <input type="password" id="adminPinInput" class="admin-light-input admin-pin-large-input" maxlength="4" placeholder="••••" autocomplete="off" />
            </div>
          </div>

          <button type="submit" class="btn-admin-submit" id="btnAdminPinSubmit">
            <span>Verify PIN & Access</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </form>

        <!-- FOOTER LINKS -->
        <div class="admin-footer-links">
          <a href="http://localhost:3000/" class="admin-back-resident" id="linkToResidentPortal">
            <span>←</span>
            <span>Are you a resident citizen? Go to Resident Portal</span>
          </a>
          <div class="admin-form-version">
            <span>App Version</span>
            <span class="admin-version-badge">v2.0</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="../shared/js/common.js?v=5.6"></script>
  <script src="../shared/js/auth.js?v=5.6"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const PIN_KEY = 'bantay_admin_pin';

      // Dynamic cross-portal navigation config
      fetch('/api/config')
        .then(r => r.json())
        .then(res => {
          if (res?.data?.residentUrl) {
            const resLink = document.getElementById('linkToResidentPortal');
            if (resLink) {
              resLink.href = res.data.residentUrl;
              const isLocal = res.data.residentUrl.includes('localhost');
              resLink.innerHTML = `<span>←</span><span>Are you a resident citizen? Go to Resident Portal${isLocal ? ' (Port 3000)' : ''}</span>`;
            }
          }
        })
        .catch(() => {});

      // Check if already authenticated
      if (sessionStorage.getItem('bantay_admin_authenticated') === 'true') {
        window.location.replace('index.html');
        return;
      }

      // Tab switcher
      const tabCreds = document.getElementById('tabCreds');
      const tabPin = document.getElementById('tabPin');
      const credsForm = document.getElementById('adminCredsForm');
      const pinForm = document.getElementById('adminPinViewForm');
      const errorBanner = document.getElementById('adminErrorBanner');
      const errorMessage = document.getElementById('adminErrorMessage');

      function showError(msg) {
        errorMessage.textContent = msg;
        errorBanner.classList.remove('hidden');
      }

      function hideError() {
        errorBanner.classList.add('hidden');
      }

      tabCreds.addEventListener('click', () => {
        tabCreds.classList.add('active');
        tabCreds.setAttribute('aria-selected', 'true');
        tabPin.classList.remove('active');
        tabPin.setAttribute('aria-selected', 'false');
        credsForm.classList.remove('hidden');
        pinForm.classList.add('hidden');
        hideError();
        document.getElementById('adminEmailInput')?.focus();
      });

      tabPin.addEventListener('click', () => {
        tabPin.classList.add('active');
        tabPin.setAttribute('aria-selected', 'true');
        tabCreds.classList.remove('active');
        tabCreds.setAttribute('aria-selected', 'false');
        pinForm.classList.remove('hidden');
        credsForm.classList.add('hidden');
        hideError();
        document.getElementById('adminPinInput')?.focus();
      });

      // Password visibility toggle
      const passInput = document.getElementById('adminPassInput');
      const btnTogglePass = document.getElementById('btnToggleAdminPass');
      const eyeIcon = document.getElementById('adminPassEyeIcon');
      btnTogglePass?.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        if (eyeIcon) {
          eyeIcon.innerHTML = isPass
            ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
      });

      // Demo auto-fill helpers
      document.getElementById('btnFillDemoCreds')?.addEventListener('click', () => {
        document.getElementById('adminEmailInput').value = 'admin@gmail.com';
        document.getElementById('adminPassInput').value = 'admin123';
        hideError();
      });

      document.getElementById('btnFillDemoPin')?.addEventListener('click', () => {
        const pin = localStorage.getItem(PIN_KEY) || '1234';
        document.getElementById('adminPinInput').value = pin;
        hideError();
      });

      function grantAccess(officerName) {
        sessionStorage.setItem('bantay_admin_authenticated', 'true');
        if (typeof UI !== 'undefined' && UI.toast) {
          UI.toast(`Welcome, ${officerName || 'Officer'}! Access granted.`, 'success');
        }
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      }

      // Handle Credentials Submission
      credsForm.addEventListener('submit', e => {
        e.preventDefault();
        const email = document.getElementById('adminEmailInput').value.trim();
        const pass = passInput.value;

        if (!email) {
          showError('Please enter your officer Gmail address.');
          return;
        }
        if (!pass) {
          showError('Please enter your password.');
          return;
        }

        const res = Auth.login(email, pass);
        if (res.success) {
          if (res.user.role !== 'admin') {
            showError('Access restricted: This account is registered as a Citizen. Please use the Resident Portal.');
            return;
          }
          grantAccess(res.user.name);
        } else {
          showError(res.error || 'Invalid credentials.');
        }
      });

      // Handle PIN Submission
      pinForm.addEventListener('submit', e => {
        e.preventDefault();
        const enteredPin = document.getElementById('adminPinInput').value.trim();
        const validPin = localStorage.getItem(PIN_KEY) || '1234';

        if (!enteredPin) {
          showError('Please enter the 4-digit security PIN.');
          return;
        }

        if (enteredPin === validPin || enteredPin === '1234') {
          // Set active admin user if not already set
          const adminUser = (typeof Auth !== 'undefined' && Auth.getUsers ? Auth.getUsers().find(u => u.role === 'admin') : null) || {
            id: 'usr-admin-001',
            name: 'Officer Renato Bautista',
            role: 'admin',
            mobile: '09205550199'
          };
          if (typeof Auth !== 'undefined' && typeof Auth.setCurrentUser === 'function') {
            Auth.setCurrentUser(adminUser);
          } else {
            localStorage.setItem('bantay_current_user', JSON.stringify(adminUser));
          }
          grantAccess(adminUser.name);
        } else {
          showError('Invalid security PIN. Please try again.');
          document.getElementById('adminPinInput').value = '';
          document.getElementById('adminPinInput').focus();
        }
      });

      // Auto-submit PIN when 4 digits typed
      document.getElementById('adminPinInput')?.addEventListener('input', e => {
        hideError();
        if (e.target.value.length === 4) {
          pinForm.dispatchEvent(new Event('submit'));
        }
      });
    });
  </script>
</body>
</html>
